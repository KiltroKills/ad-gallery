<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Ads</title>
    <style>
      /* Look plan: canvas #050506, tile well #0B0B0E, ink #F4F4F6, muted ink
         #9A9AA3 for labels and counts, hairline #232328, one accent #FF5A7A on
         the focus ring only (a pressed chip inverts to ink instead). Type: the
         system sans for chips and captions (label-medium 12/16 500, body-small
         12/16 400), monospace for each tile's short id. Radii: 12px tiles, full
         circle on every pill, chip and button. The one bold element: colour
         swatches on the chips and tile tags of a value that has one (hair
         colours today); their colours encode content, so they come from the tag
         vocabulary's data (vocab.json) as an inline --sw, never from this
         stylesheet. Spacing, type and motion values come from the design-tokens
         scale. */
      :root {
        --color-canvas: #050506;
        --color-well: #0b0b0e;
        --color-ink: #f4f4f6;
        --color-muted: #9a9aa3;
        --color-hairline: #232328;
        --color-accent: #ff5a7a;
        --font-web-system: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --text-label-medium: 12px;
        --text-label-small: 11px;
        --leading-16: 16px;
        --spacing-2: 2px;
        --spacing-4: 4px;
        --spacing-6: 6px;
        --spacing-8: 8px;
        --spacing-12: 12px;
        --spacing-16: 16px;
        --spacing-24: 24px;
        --tile-min: 176px;
        --radius-tile: 12px;
        --radius-full: 9999px;
        --control: 32px;
        --control-touch: 44px;
        --target-web-min: 24px;
        --swatch: 10px;
        --icon: 16px;
        --duration-100: 100ms;
        --ease-standard: cubic-bezier(0.2, 0, 0, 1);
        --focus-ring-width: 2px;
        --focus-ring-offset: 2px;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        min-height: 100%;
        background: var(--color-canvas);
        color: var(--color-ink);
        font-family: var(--font-web-system);
      }

      button {
        font: inherit;
        color: inherit;
      }

      :focus-visible {
        outline: var(--focus-ring-width) solid var(--color-accent);
        outline-offset: var(--focus-ring-offset);
      }

      /* ------------------------------------------------------------ filters */

      .filters {
        display: grid;
        gap: var(--spacing-12);
        padding: max(var(--spacing-16), env(safe-area-inset-top)) max(var(--spacing-8), env(safe-area-inset-right))
          var(--spacing-12) max(var(--spacing-8), env(safe-area-inset-left));
        background: var(--color-canvas);
        border-bottom: 1px solid var(--color-hairline);
      }

      .groups {
        display: flex;
        flex-wrap: wrap;
        gap: var(--spacing-12) var(--spacing-24);
      }

      .group {
        display: flex;
        align-items: center;
        gap: var(--spacing-8);
        min-width: 0;
      }

      .group-label,
      .status {
        color: var(--color-muted);
        font-size: var(--text-label-medium);
        line-height: var(--leading-16);
        font-weight: 500;
      }

      .group-label {
        flex: none;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: var(--spacing-6);
        min-width: 0;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-6);
        min-height: var(--control);
        padding: 0 var(--spacing-12);
        border: 1px solid var(--color-hairline);
        border-radius: var(--radius-full);
        background: var(--color-well);
        font-size: var(--text-label-medium);
        line-height: var(--leading-16);
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        transition: border-color var(--duration-100) var(--ease-standard);
      }

      .chip:hover {
        border-color: var(--color-muted);
      }

      .chip .n {
        color: var(--color-muted);
        font-variant-numeric: tabular-nums;
      }

      .chip[aria-pressed='true'] {
        border-color: var(--color-ink);
        background: var(--color-ink);
        color: var(--color-canvas);
      }

      .chip[aria-pressed='true'] .n {
        color: color-mix(in srgb, var(--color-canvas) 64%, transparent);
      }

      .chip:disabled {
        opacity: 0.38;
        cursor: default;
      }

      .chip:disabled:hover {
        border-color: var(--color-hairline);
      }

      .status {
        display: flex;
        align-items: center;
        gap: var(--spacing-12);
        min-height: var(--target-web-min);
      }

      .text-button {
        min-height: var(--target-web-min);
        padding: 0 var(--spacing-8);
        border: 0;
        border-radius: var(--radius-full);
        background: none;
        color: var(--color-ink);
        font-size: var(--text-label-medium);
        font-weight: 500;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }

      /* A tag value's colour, as a dot: its swatch from vocab.json, set inline as
         --sw. `multi` and `none` are the two swatches that are not one colour. */
      .sw {
        flex: none;
        width: var(--swatch);
        height: var(--swatch);
        border-radius: var(--radius-full);
        background: var(--sw);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--color-ink) 28%, transparent);
      }

      .sw[data-sw='multi'] {
        background: conic-gradient(#c0532f 0 25%, #e6c983 0 50%, #7a5034 0 75%, #c8cad2 0);
      }

      .sw[data-sw='none'] {
        background: none;
        box-shadow: inset 0 0 0 1px var(--color-muted);
      }

      /* Wide screens keep the filters in reach while scrolling; on a phone the
         bar scrolls away and each group scrolls sideways on one line. */
      @media (min-width: 900px) and (min-height: 640px) {
        .filters {
          position: sticky;
          top: 0;
          z-index: 1;
        }
      }

      @media (max-width: 639px) {
        .groups {
          display: grid;
          gap: var(--spacing-8);
        }

        .group {
          display: grid;
          grid-template-columns: 64px minmax(0, 1fr);
        }

        .chips {
          flex-wrap: nowrap;
          overflow-x: auto;
          scrollbar-width: none;
          margin-right: calc(-1 * var(--spacing-8));
          padding-right: var(--spacing-8);
        }

        .chips::-webkit-scrollbar {
          display: none;
        }
      }

      /* ------------------------------------------------------------ grid */

      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--tile-min), 1fr));
        gap: var(--spacing-16) var(--spacing-8);
        padding: var(--spacing-8) max(var(--spacing-8), env(safe-area-inset-right))
          max(var(--spacing-8), env(safe-area-inset-bottom)) max(var(--spacing-8), env(safe-area-inset-left));
      }

      .ad {
        display: flex;
        flex-direction: column;
        gap: var(--spacing-8);
        min-width: 0;
      }

      .tile {
        position: relative;
        aspect-ratio: 9 / 16;
        overflow: hidden;
        border-radius: var(--radius-tile);
        background: var(--color-well);
        contain: paint;
      }

      .tile video {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        cursor: pointer;
      }

      .dl {
        position: absolute;
        top: var(--spacing-8);
        right: var(--spacing-8);
        display: grid;
        place-items: center;
        width: var(--control);
        height: var(--control);
        border: 1px solid color-mix(in srgb, var(--color-hairline) 80%, transparent);
        border-radius: var(--radius-full);
        background: color-mix(in srgb, var(--color-canvas) 62%, transparent);
        color: var(--color-ink);
        opacity: 0.88;
        transition: opacity var(--duration-100) var(--ease-standard);
      }

      .dl:hover {
        opacity: 1;
      }

      .dl:focus-visible {
        opacity: 1;
      }

      .dl svg {
        width: var(--icon);
        height: var(--icon);
      }

      /* The tile's short id: the first characters of its stable tile id, so it
         never changes when other ads come or go. One click selects it whole. */
      .id {
        position: absolute;
        left: var(--spacing-8);
        bottom: var(--spacing-8);
        padding: 3px 7px;
        border: 1px solid color-mix(in srgb, var(--color-hairline) 80%, transparent);
        border-radius: var(--radius-full);
        background: color-mix(in srgb, var(--color-canvas) 62%, transparent);
        color: var(--color-ink);
        font: 500 var(--text-label-small) / 1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.04em;
        opacity: 0.82;
        user-select: all;
        -webkit-user-select: all;
        cursor: text;
      }

      /* Under each tile: who it shows, then its tags. A tag filters by its value. */
      .meta {
        display: grid;
        gap: var(--spacing-6);
        padding: 0 var(--spacing-2);
      }

      .desc {
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        color: var(--color-muted);
        font-size: var(--text-label-medium);
        line-height: var(--leading-16);
      }

      .desc strong {
        color: var(--color-ink);
        font-weight: 500;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: var(--spacing-4);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: var(--spacing-4);
        min-height: var(--target-web-min);
        padding: 0 var(--spacing-8);
        border: 1px solid var(--color-hairline);
        border-radius: var(--radius-full);
        background: none;
        color: var(--color-muted);
        font-size: var(--text-label-medium);
        line-height: var(--leading-16);
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
        transition: border-color var(--duration-100) var(--ease-standard);
      }

      .tag:hover {
        border-color: var(--color-muted);
        color: var(--color-ink);
      }

      .tag[aria-pressed='true'] {
        border-color: var(--color-ink);
        color: var(--color-ink);
      }

      /* Loading: tile-shaped placeholders in the grid's own anatomy. */
      .skeleton .tile {
        background: var(--color-well);
      }

      .skeleton .bar {
        height: var(--spacing-12);
        border-radius: var(--radius-full);
        background: var(--color-well);
      }

      .skeleton .bar + .bar {
        width: 64%;
      }

      .empty {
        display: grid;
        justify-items: center;
        gap: var(--spacing-12);
        padding: var(--spacing-24) var(--spacing-16);
        color: var(--color-muted);
        font-size: var(--text-label-medium);
        line-height: var(--leading-16);
        text-align: center;
      }

      @media (pointer: coarse) {
        .dl {
          width: var(--control-touch);
          height: var(--control-touch);
        }

        .chip {
          min-height: var(--control-touch);
        }

        .tag,
        .text-button {
          min-height: var(--control);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dl,
        .chip,
        .tag {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="filters" aria-label="Filter ads">
      <div class="groups" id="groups"></div>
      <p class="status">
        <span id="count" aria-live="polite"></span>
        <button type="button" class="text-button" id="clear" hidden>Clear filters</button>
      </p>
    </header>
    <main id="grid" aria-label="Ads"></main>
    <div class="empty" id="empty" hidden>
      <p id="empty-text"></p>
      <button type="button" class="chip" id="empty-action"></button>
    </div>
    <script>
      // The ads themselves are the content, so they play under reduced motion
      // too; only the controls' hover fades are UI motion, and they are switched off.
      const grid = document.getElementById('grid')
      const groupsEl = document.getElementById('groups')
      const countEl = document.getElementById('count')
      const clearEl = document.getElementById('clear')
      const emptyEl = document.getElementById('empty')
      const tiles = new Map()
      let ads = []
      let loaded = false
      const ICON =
        '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m9 12v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10l5 5l5-5"/></svg>'

      // The tag vocabulary comes from vocab.json (the data dir's tag-vocab.json):
      // groups in display order, each with its values, labels and swatches. This
      // is only the fallback for when that file cannot be read. A key or value
      // that ads carry but the vocabulary lacks still shows, after the known ones.
      const DEFAULT_VOCAB = [
        { key: 'gender', label: 'Gender', values: [{ value: 'female' }, { value: 'male' }, { value: 'mixed' }] },
        { key: 'style', label: 'Style', values: [{ value: 'anime' }, { value: 'realistic' }] },
        {
          key: 'category',
          label: 'Category',
          values: ['goth', 'hot', 'athletic', 'cute', 'alt', 'elegant', 'nerdy', 'fantasy', 'professional', 'soft', 'casual'].map(
            (value) => ({ value })
          )
        },
        {
          key: 'hair',
          label: 'Hair',
          values: [
            { value: 'black', swatch: '#17171a' },
            { value: 'brown', swatch: '#7a5034' },
            { value: 'blonde', swatch: '#e6c983' },
            { value: 'red', swatch: '#c0532f' },
            { value: 'pink', swatch: '#f09cc0' },
            { value: 'silver', swatch: '#c8cad2' },
            { value: 'blue', swatch: '#4c7fe0' },
            { value: 'purple', swatch: '#9468d8' },
            { value: 'green', swatch: '#4caa6a' },
            { value: 'multi', label: 'Mixed hair', swatch: 'multi' },
            { value: 'none', label: 'No hair', swatch: 'none' }
          ]
        }
      ]
      // Keys of an ad's tags that are text or a number, not a filter group.
      const NOT_GROUP = new Set(['name', 'desc', 'cast', 'confidence', 'id'])
      const SWATCH = /^(#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})|multi|none)$/i
      const capitalize = (s) => s.charAt(0).toUpperCase() + s.slice(1)

      let vocab = DEFAULT_VOCAB
      let vocabSig = JSON.stringify(vocab)
      // The vocabulary plus whatever the ads carry beyond it: [{ key, label, values: [{ value, label?, swatch? }] }].
      let GROUPS = []
      const lookup = new Map()

      function buildGroups() {
        const out = vocab.map((g) => ({ key: g.key, label: g.label || capitalize(g.key), values: g.values.map((v) => ({ ...v })) }))
        const byKey = new Map(out.map((g) => [g.key, g]))
        for (const ad of ads) {
          for (const [key, value] of Object.entries(ad.t || {})) {
            if (NOT_GROUP.has(key) || typeof value !== 'string') continue
            let g = byKey.get(key)
            if (!g) {
              g = { key, label: capitalize(key), values: [] }
              byKey.set(key, g)
              out.push(g)
            }
            if (!g.values.some((v) => v.value === value)) g.values.push({ value })
          }
        }
        GROUPS = out
        lookup.clear()
        for (const g of GROUPS) lookup.set(g.key, { group: g, values: new Map(g.values.map((v) => [v.value, v])) })
      }

      const nameOf = (key, value) => lookup.get(key)?.values.get(value)?.label || capitalize(value)
      const groupLabel = (key) => lookup.get(key)?.group.label || capitalize(key)

      // ---------------------------------------------------------- filter state

      // key -> Set of values; groups AND, values within a group OR. Every key in
      // the URL hash is kept, whether or not a group of that name exists (yet).
      let filter = new Map()
      const filterOf = (key) => {
        if (!filter.has(key)) filter.set(key, new Set())
        return filter.get(key)
      }
      const active = () => GROUPS.some((g) => filterOf(g.key).size)

      function readHash() {
        const params = new URLSearchParams(location.hash.slice(1))
        filter = new Map()
        for (const [key, list] of params) filter.set(key, new Set(list.split(',').filter(Boolean)))
      }

      function writeHash() {
        const parts = GROUPS.filter((g) => filterOf(g.key).size).map(
          (g) => `${encodeURIComponent(g.key)}=${[...filterOf(g.key)].map(encodeURIComponent).join(',')}`
        )
        history.replaceState(null, '', parts.length ? `#${parts.join('&')}` : location.pathname + location.search)
      }

      // Does an ad pass every group's filter, optionally ignoring one group?
      function passes(ad, skip) {
        for (const g of GROUPS) {
          if (g.key === skip || !filterOf(g.key).size) continue
          if (!ad.t || !filterOf(g.key).has(ad.t[g.key])) return false
        }
        return true
      }

      function toggle(key, value) {
        const set = filterOf(key)
        if (set.has(value)) set.delete(value)
        else set.add(value)
        writeHash()
        render()
      }

      function clearAll() {
        for (const g of GROUPS) filterOf(g.key).clear()
        writeHash()
        render()
      }

      // ---------------------------------------------------------- filter bar

      // The dot for a value that has a swatch in the vocabulary; null otherwise.
      function swatch(key, value) {
        const sw = lookup.get(key)?.values.get(value)?.swatch
        if (typeof sw !== 'string' || !SWATCH.test(sw)) return null
        const s = document.createElement('span')
        s.className = 'sw'
        if (sw[0] === '#') s.style.setProperty('--sw', sw)
        else s.dataset.sw = sw.toLowerCase()
        s.setAttribute('aria-hidden', 'true')
        return s
      }

      // Chips for every value some ad carries (or that is filtered on), each
      // with how many ads it would show given the other groups' filters.
      function renderBar() {
        const frag = document.createDocumentFragment()
        for (const g of GROUPS) {
          const present = new Set(ads.map((ad) => ad.t?.[g.key]).filter(Boolean))
          for (const v of filterOf(g.key)) present.add(v)
          const values = g.values.map((v) => v.value).filter((v) => present.has(v))
          for (const v of present) if (!values.includes(v)) values.push(v)
          if (!values.length) continue
          const pool = ads.filter((ad) => passes(ad, g.key))
          const wrap = document.createElement('div')
          wrap.className = 'group'
          wrap.setAttribute('role', 'group')
          const label = document.createElement('span')
          label.className = 'group-label'
          label.id = `g-${g.key}`
          label.textContent = g.label
          wrap.setAttribute('aria-labelledby', label.id)
          const chips = document.createElement('div')
          chips.className = 'chips'
          for (const v of values) {
            const n = pool.filter((ad) => ad.t?.[g.key] === v).length
            const on = filterOf(g.key).has(v)
            const b = document.createElement('button')
            b.type = 'button'
            b.className = 'chip'
            b.dataset.key = g.key
            b.dataset.value = v
            b.setAttribute('aria-pressed', String(on))
            b.disabled = !n && !on
            const dot = swatch(g.key, v)
            if (dot) b.append(dot)
            const text = document.createElement('span')
            text.textContent = nameOf(g.key, v)
            const count = document.createElement('span')
            count.className = 'n'
            count.textContent = n
            b.append(text, count)
            b.setAttribute('aria-label', `${nameOf(g.key, v)}, ${n} ad${n === 1 ? '' : 's'}`)
            chips.append(b)
          }
          wrap.append(label, chips)
          frag.append(wrap)
        }
        // Keep keyboard focus on the chip that was pressed across the re-render.
        const focused = document.activeElement?.closest?.('.chip')
        const keep = focused && groupsEl.contains(focused) ? [focused.dataset.key, focused.dataset.value] : null
        groupsEl.replaceChildren(frag)
        if (keep) groupsEl.querySelector(`.chip[data-key="${keep[0]}"][data-value="${CSS.escape(keep[1])}"]`)?.focus()
      }

      groupsEl.addEventListener('click', (e) => {
        const b = e.target.closest('.chip')
        if (b && !b.disabled) toggle(b.dataset.key, b.dataset.value)
      })
      clearEl.addEventListener('click', clearAll)

      // ---------------------------------------------------------- tiles

      // Only tiles on or near the screen decode; the rest wait paused.
      const io = new IntersectionObserver(
        (entries) => {
          for (const e of entries) {
            const v = e.target.querySelector('video')
            if (e.isIntersecting) {
              if (!v.getAttribute('src')) v.src = v.dataset.src
              v.play().catch(() => {})
            } else if (!v.paused) {
              v.pause()
            }
          }
        },
        { rootMargin: '25% 0px' }
      )

      // A click gives one ad its sound and mutes the rest; a second click mutes it.
      function toggleSound(v) {
        const on = v.muted
        for (const other of grid.querySelectorAll('video')) other.muted = true
        v.muted = !on
        if (on) v.play().catch(() => {})
      }

      function renderMeta(el, ad) {
        const key = vocabSig + JSON.stringify(ad.t || null)
        if (el.dataset.tags === key) return
        el.dataset.tags = key
        const meta = el.querySelector('.meta')
        const t = ad.t || {}
        const desc = document.createElement('p')
        desc.className = 'desc'
        if (t.name) {
          const strong = document.createElement('strong')
          strong.textContent = t.name
          desc.append(strong, t.desc ? ` ${t.desc}` : '')
        } else if (t.desc) {
          desc.textContent = t.desc.charAt(0).toUpperCase() + t.desc.slice(1)
        }
        const full = [t.name, t.desc].filter(Boolean).join(': ')
        if (full) desc.title = full
        el.querySelector('video').setAttribute('aria-label', full || 'Ad')
        const tags = document.createElement('div')
        tags.className = 'tags'
        for (const g of GROUPS) {
          const v = t[g.key]
          if (!v) continue
          const b = document.createElement('button')
          b.type = 'button'
          b.className = 'tag'
          b.dataset.key = g.key
          b.dataset.value = v
          b.title = `Filter by ${g.label.toLowerCase()}: ${nameOf(g.key, v)}`
          const dot = swatch(g.key, v)
          if (dot) b.append(dot)
          b.append(nameOf(g.key, v))
          tags.append(b)
        }
        meta.replaceChildren(...(desc.childNodes.length ? [desc] : []), ...(tags.childNodes.length ? [tags] : []))
      }

      function apply(el, ad) {
        const v = el.querySelector('video')
        const a = el.querySelector('a.dl')
        if (v.dataset.src !== ad.v) {
          v.dataset.src = ad.v
          v.poster = ad.p
          if (v.getAttribute('src')) {
            v.src = ad.v
            v.play().catch(() => {})
          }
        }
        a.href = ad.d
        a.setAttribute('download', ad.n || decodeURIComponent(ad.d.split('/').pop()))
        renderMeta(el, ad)
      }

      function make(ad) {
        const el = document.createElement('article')
        el.className = 'ad'
        const tile = document.createElement('div')
        tile.className = 'tile'
        const v = document.createElement('video')
        v.muted = true
        v.defaultMuted = true
        v.loop = true
        v.playsInline = true
        v.preload = 'none'
        v.setAttribute('muted', '')
        v.setAttribute('playsinline', '')
        v.addEventListener('click', () => toggleSound(v))
        const a = document.createElement('a')
        a.className = 'dl'
        a.setAttribute('aria-label', 'Download')
        a.innerHTML = ICON
        const id = document.createElement('span')
        id.className = 'id'
        id.textContent = ad.id.slice(0, 5)
        id.title = ad.id
        tile.append(v, a, id)
        const meta = document.createElement('div')
        meta.className = 'meta'
        el.append(tile, meta)
        apply(el, ad)
        io.observe(el)
        return el
      }

      // A tag under a tile filters the grid to its value (a second click undoes it).
      grid.addEventListener('click', (e) => {
        const b = e.target.closest('.tag')
        if (b) toggle(b.dataset.key, b.dataset.value)
      })

      function skeletons(n) {
        for (let i = 0; i < n; i++) {
          const el = document.createElement('div')
          el.className = 'ad skeleton'
          el.setAttribute('aria-hidden', 'true')
          el.innerHTML = '<div class="tile"></div><div class="meta"><div class="bar"></div><div class="bar"></div></div>'
          grid.append(el)
        }
      }

      // ---------------------------------------------------------- render

      function render() {
        let shown = 0
        for (const ad of ads) {
          const el = tiles.get(ad.id)
          if (!el) continue
          const ok = passes(ad)
          el.hidden = !ok
          if (ok) shown++
          for (const b of el.querySelectorAll('.tag')) {
            b.setAttribute('aria-pressed', String(filterOf(b.dataset.key).has(b.dataset.value)))
          }
        }
        renderBar()
        const on = active()
        countEl.textContent = on ? `${shown} of ${ads.length} ads` : `${ads.length} ads`
        clearEl.hidden = !on
        const empty = loaded && shown === 0
        emptyEl.hidden = !empty
        if (empty) {
          document.getElementById('empty-text').textContent = on ? 'No ad matches these filters.' : 'No ads in the gallery yet.'
          document.getElementById('empty-action').textContent = on ? 'Clear filters' : 'Check again'
        }
      }

      document.getElementById('empty-action').addEventListener('click', () => (active() ? clearAll() : refresh()))

      // vocab.json: the tag vocabulary. Missing or malformed -> keep what is shown
      // (the built-in defaults until a good copy has loaded).
      async function loadVocab() {
        try {
          const r = await fetch('vocab.json', { cache: 'no-store' })
          if (!r.ok) return null
          const raw = (await r.json()).groups
          const groups = (Array.isArray(raw) ? raw : [])
            .filter((g) => g && typeof g.key === 'string' && !NOT_GROUP.has(g.key) && Array.isArray(g.values))
            .map((g) => ({
              key: g.key,
              label: typeof g.label === 'string' && g.label ? g.label : capitalize(g.key),
              values: g.values.filter((v) => v && typeof v.value === 'string' && v.value)
            }))
          return groups.length ? groups : null
        } catch {
          return null
        }
      }

      async function refresh() {
        let next
        try {
          // Relative, so the same page works on the local server and on the
          // published copy under a GitHub Pages subpath.
          const [r, v] = await Promise.all([fetch('ads.json', { cache: 'no-store' }), loadVocab()])
          if (!r.ok) return
          next = await r.json()
          if (v) {
            vocab = v
            vocabSig = JSON.stringify(v)
          }
        } catch {
          return
        }
        if (!loaded) {
          for (const s of grid.querySelectorAll('.skeleton')) s.remove()
          loaded = true
        }
        ads = next
        buildGroups()
        const keep = new Set(ads.map((ad) => ad.id))
        for (const [id, el] of tiles) {
          if (!keep.has(id)) {
            io.unobserve(el)
            el.remove()
            tiles.delete(id)
          }
        }
        // Newest first. New tiles are inserted in place, so a playing video is
        // never detached and restarted.
        let prev = null
        for (const ad of ads) {
          let el = tiles.get(ad.id)
          if (!el) {
            el = make(ad)
            tiles.set(ad.id, el)
          } else {
            apply(el, ad)
          }
          const want = prev ? prev.nextSibling : grid.firstChild
          if (el !== want) {
            // Moving a tile detaches its video, which pauses it: resume it.
            const v = el.querySelector('video')
            const playing = el.isConnected && !v.paused
            grid.insertBefore(el, want)
            if (playing) v.play().catch(() => {})
          }
          prev = el
        }
        render()
      }

      buildGroups()
      readHash()
      window.addEventListener('hashchange', () => {
        readHash()
        render()
      })
      skeletons(8)
      refresh()
      setInterval(refresh, 30000)
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) refresh()
      })
    </script>
  </body>
</html>
